<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>習慣追蹤</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#534AB7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="習慣追蹤">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f5f4f0; --surface: #fff; --border: rgba(0,0,0,.1);
  --text: #1a1a1a; --muted: #888; --radius: 12px; --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
.app { display: flex; flex-direction: column; height: 100vh; max-width: 420px; margin: 0 auto; background: var(--surface); position: relative; overflow: hidden; }
.header { padding: 16px 20px 0; flex-shrink: 0; }
.header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.header-title { font-size: 22px; font-weight: 600; }
.header-date  { font-size: 13px; color: var(--muted); }
.nav-tabs { display: flex; border-bottom: 1px solid var(--border); margin-top: 12px; }
.nav-tab { flex: 1; text-align: center; padding: 10px 0; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; transition: all .2s; }
.nav-tab.active { color: #534AB7; border-bottom-color: #534AB7; }
.view { display: none; flex: 1; overflow: hidden; }
.view.active { display: flex; flex-direction: column; }
.habit-swipe-wrap { flex: 1; overflow: hidden; }
.habit-pages { display: flex; height: 100%; transition: transform .3s ease; }
.habit-page { min-width: 100%; height: 100%; overflow-y: auto; padding: 20px 20px 32px; }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; color: var(--muted); text-align: center; padding: 40px; }
.habit-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.habit-name { font-size: 20px; font-weight: 600; }
.icon-btn { width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 8px; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
.streak-row { display: flex; gap: 16px; margin-bottom: 20px; padding: 14px; background: var(--bg); border-radius: var(--radius-sm); }
.streak-item { text-align: center; }
.streak-num { font-size: 22px; font-weight: 700; }
.streak-label { font-size: 10px; color: var(--muted); margin-top: 1px; }
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-nav-title { font-size: 14px; font-weight: 500; }
.cal-nav-btn { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--muted); padding: 2px 8px; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
.cal-dh { text-align: center; font-size: 9px; color: var(--muted); padding: 1px 0; }
.cal-day { aspect-ratio: 1; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--muted); cursor: pointer; transition: all .15s; user-select: none; }
.cal-day.done { color: #fff; font-weight: 600; }
.cal-day.today { outline: 2px solid #534AB7; outline-offset: -1px; color: var(--text); font-weight: 600; }
.cal-day.today.done { color: #fff; }
.cal-day.future { opacity: .22; cursor: default; }
.num-input-row { display: flex; gap: 8px; align-items: center; margin-top: 18px; }
.num-input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 18px; font-weight: 600; text-align: center; outline: none; background: var(--surface); color: var(--text); }
.record-btn { padding: 10px 18px; border-radius: var(--radius-sm); border: none; font-size: 14px; font-weight: 600; color: #fff; cursor: pointer; }
.chart-wrap { background: var(--bg); border-radius: var(--radius-sm); padding: 14px; margin-top: 16px; height: 160px; }
.page-dots { display: flex; justify-content: center; gap: 6px; padding: 8px 0; flex-shrink: 0; }
.page-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); cursor: pointer; transition: all .2s; }
.page-dot.active { background: #534AB7; transform: scale(1.2); }
.grad-legend { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.grad-label { font-size: 10px; color: var(--muted); }
.today-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.today-summary { padding: 14px 20px 12px; flex-shrink: 0; }
.kanban-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.kanban-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.kanban-meta { font-size: 11px; color: var(--muted); }
.kanban-block { border-radius: 3px; transition: background .3s ease; }
.today-list { flex: 1; overflow-y: auto; padding: 6px 16px 24px; }
.today-section-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 10px 4px 6px; }
.today-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; cursor: pointer; transition: background .15s; background: var(--surface); user-select: none; }
.today-item:hover { background: var(--bg); }
.today-item.done-item { opacity: .5; }
.today-item.done-item .today-item-name { text-decoration: line-through; color: var(--muted); }
.today-check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; transition: all .18s; }
.today-item-icon { font-size: 22px; flex-shrink: 0; }
.today-item-body { flex: 1; min-width: 0; }
.today-item-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.today-item-sub  { font-size: 11px; color: var(--muted); }
.today-num-inline { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.today-num-inline input { width: 80px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; font-weight: 600; text-align: center; outline: none; background: var(--surface); color: var(--text); }
.today-num-inline button { padding: 5px 10px; border-radius: 6px; border: none; font-size: 12px; font-weight: 600; color: #fff; cursor: pointer; }
.today-num-inline span { font-size: 12px; color: var(--muted); }
.all-done-banner { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 48px 0 0; color: var(--muted); }
.dashboard { flex: 1; overflow-y: auto; padding: 16px 20px 24px; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.stat-card { background: var(--bg); border-radius: var(--radius-sm); padding: 14px; }
.stat-num { font-size: 26px; font-weight: 700; }
.stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
.section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
.dash-habit { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.dash-habit-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.dash-habit-name { font-size: 14px; font-weight: 600; }
.dash-pct { font-size: 14px; font-weight: 700; }
.progress-bar { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; transition: width .4s; }
.dash-sub { font-size: 11px; color: var(--muted); margin-top: 6px; }
.modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: var(--surface); border-radius: var(--radius); width: calc(100% - 40px); padding: 20px; max-height: 85vh; overflow-y: auto; }
.modal-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.tpl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.tpl-card { border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 14px; cursor: pointer; transition: all .15s; }
.tpl-card.selected { border-color: #534AB7; background: #EEEDFE; }
.tpl-icon-box { width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 8px; }
.tpl-name { font-size: 13px; font-weight: 600; }
.tpl-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
.field-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.field-input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; outline: none; margin-bottom: 12px; background: var(--surface); color: var(--text); }
.field-input:focus { border-color: #534AB7; }
.modal-actions { display: flex; gap: 8px; margin-top: 4px; }
.btn { flex: 1; padding: 11px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 14px; font-weight: 600; cursor: pointer; background: none; color: var(--text); }
.btn-primary { background: #534AB7; border-color: #534AB7; color: #fff; }
.btn-danger  { background: #E24B4A; border-color: #E24B4A; color: #fff; }
.btn:hover { background: var(--bg); }
.btn-primary:hover, .btn-danger:hover { opacity: .88; background: revert; }
.confirm-modal { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 200; }
.confirm-box { background: var(--surface); border-radius: var(--radius); width: calc(100% - 60px); padding: 20px; text-align: center; }
.confirm-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.confirm-sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
.confirm-actions { display: flex; gap: 8px; }
.toast { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #222; color: #fff; padding: 10px 18px; border-radius: 24px; font-size: 13px; font-weight: 500; opacity: 0; transition: all .3s; z-index: 300; white-space: nowrap; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.loading { display: flex; align-items: center; justify-content: center; height: 100vh; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="header-title">習慣追蹤 <span id="streak-fire"></span></div>
        <div class="header-date" id="today-date"></div>
      </div>
      <button class="icon-btn" onclick="openAddModal()" style="width:38px;height:38px;font-size:22px;border-radius:10px;">+</button>
    </div>
    <div class="nav-tabs">
      <div class="nav-tab active" onclick="switchView('habits',this)">習慣</div>
      <div class="nav-tab"        onclick="switchView('today',this)">今日任務</div>
      <div class="nav-tab"        onclick="switchView('dashboard',this)">總覽</div>
    </div>
  </div>

  <div class="view active" id="view-habits">
    <div class="habit-swipe-wrap" id="swipe-wrap">
      <div class="habit-pages" id="habit-pages"></div>
    </div>
    <div class="page-dots" id="page-dots"></div>
  </div>

  <div class="view" id="view-today">
    <div class="today-view">
      <div class="today-summary" id="today-summary"></div>
      <div class="today-list" id="today-list"></div>
    </div>
  </div>

  <div class="view" id="view-dashboard">
    <div class="dashboard" id="dashboard-content"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
// ── IndexedDB ────────────────────────────────────────────────────────────────
const DB_NAME = 'habitDB', DB_VER = 1, STORE = 'habits';
let db;

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => e.target.result.createObjectStore(STORE, { keyPath: 'id' });
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror   = e => rej(e.target.error);
  });
}

function dbGetAll() {
  return new Promise((res, rej) => {
    const tx  = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = e => res(e.target.result);
    req.onerror   = e => rej(e.target.error);
  });
}

function dbPut(habit) {
  return new Promise((res, rej) => {
    const tx  = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).put(habit);
    req.onsuccess = () => res();
    req.onerror   = e => rej(e.target.error);
  });
}

function dbDelete(id) {
  return new Promise((res, rej) => {
    const tx  = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).delete(id);
    req.onsuccess = () => res();
    req.onerror   = e => rej(e.target.error);
  });
}

async function save() {
  for (const h of habits) await dbPut(h);
}

async function saveOne(h) { await dbPut(h); }
async function removeOne(id) { await dbDelete(id); }

// ── Constants ────────────────────────────────────────────────────────────────
const PALETTE = [
  { main:'#534AB7', light:'#EEEDFE' }, { main:'#1D9E75', light:'#EAF3DE' },
  { main:'#D85A30', light:'#FAECE7' }, { main:'#BA7517', light:'#FAEEDA' },
  { main:'#2E86C1', light:'#D6EAF8' }, { main:'#8E44AD', light:'#F5EEF8' },
  { main:'#C0392B', light:'#FADBD8' }, { main:'#1A7A4A', light:'#D5F5E3' },
];
const colorForIndex = i => PALETTE[i % PALETTE.length];

const TEMPLATES = [
  { id:'checkin',  name:'每日打卡',   desc:'日曆格狀呈現',  icon:'📅' },
  { id:'number',   name:'數字追蹤',   desc:'折線圖輸入',    icon:'📈' },
  { id:'gradient', name:'日曆漸層',   desc:'完成率色彩深淺',icon:'🎨' },
  { id:'bar',      name:'柱狀圖追蹤', desc:'長條圖輸入',    icon:'📊' },
];

let habits    = [];
let curPage   = 0;
let charts    = {};
let viewMonth = {};
let addModal  = null;

const todayKey    = ()   => new Date().toISOString().slice(0,10);
const fmtDate     = d    => `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
const daysInMonth = (y,m)=> new Date(y,m+1,0).getDate();
const monthName   = (y,m)=> `${y} 年 ${m+1} 月`;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── Boot ─────────────────────────────────────────────────────────────────────
document.getElementById('today-date').textContent = fmtDate(new Date());

openDB().then(async () => {
  habits = await dbGetAll();
  if (!habits.length) {
    habits = [
      { id:'h1', name:'每天閱讀 30 分鐘', template:'checkin',  unit:'',   target:null, records:{}, order:0 },
      { id:'h2', name:'每日跑步距離',      template:'gradient', unit:'km', target:5,    records:{}, order:1 },
    ];
    await save();
  }
  habits.sort((a,b) => (a.order||0) - (b.order||0));
  habits.forEach(h => {
    if (!viewMonth[h.id]) {
      const n = new Date();
      viewMonth[h.id] = { y: n.getFullYear(), m: n.getMonth() };
    }
  });
  render();
});

// ── Service Worker ────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

// ── Swipe ─────────────────────────────────────────────────────────────────────
let tx0 = 0, isDrag = false;
const swipeWrap = document.getElementById('swipe-wrap');
swipeWrap.addEventListener('touchstart', e => { tx0 = e.touches[0].clientX; }, {passive:true});
swipeWrap.addEventListener('touchend',   e => { const dx = e.changedTouches[0].clientX - tx0; if (Math.abs(dx) > 50) goPage(curPage + (dx < 0 ? 1 : -1)); });
swipeWrap.addEventListener('mousedown',  e => { tx0 = e.clientX; isDrag = true; });
swipeWrap.addEventListener('mouseup',    e => { if (!isDrag) return; isDrag = false; const dx = e.clientX - tx0; if (Math.abs(dx) > 50) goPage(curPage + (dx < 0 ? 1 : -1)); });

// ── Render ────────────────────────────────────────────────────────────────────
function render() { renderHabits(); renderDots(); updateStreak(); }

function destroyCharts() {
  Object.values(charts).forEach(c => { try { c.destroy(); } catch(e){} });
  charts = {};
}

function renderHabits() {
  const pages = document.getElementById('habit-pages');
  destroyCharts();
  if (!habits.length) {
    pages.innerHTML = `<div class="habit-page"><div class="empty-state"><div style="font-size:48px;opacity:.3">📋</div><div style="font-weight:600;font-size:16px">還沒有習慣</div><div style="font-size:13px">點右上角 + 新增</div></div></div>`;
    return;
  }
  pages.innerHTML = habits.map((h, i) => buildHabitPage(h, i)).join('');
  pages.style.transform = `translateX(-${curPage * 100}%)`;
  setTimeout(() => habits.forEach((h, i) => {
    if (h.template === 'number' || h.template === 'bar') initChart(h, i);
  }), 50);
}

function buildHabitPage(h, idx) {
  const c   = colorForIndex(idx);
  const tpl = TEMPLATES.find(t => t.id === h.template);
  const vm  = viewMonth[h.id] || { y: new Date().getFullYear(), m: new Date().getMonth() };
  const mTotal = daysInMonth(vm.y, vm.m);
  const mDone  = Object.keys(h.records).filter(k =>
    k.startsWith(`${vm.y}-${String(vm.m+1).padStart(2,'0')}`)).length;
  let content = '';
  if      (h.template === 'checkin')  content = buildCalendar(h, vm.y, vm.m, c);
  else if (h.template === 'gradient') content = buildGradientCalendar(h, vm.y, vm.m, c);
  else {
    const tv = h.records[todayKey()] ?? '';
    content = `<div class="chart-wrap"><canvas id="chart-${h.id}"></canvas></div>
      <div class="num-input-row">
        <input class="num-input" id="input-${h.id}" type="number" min="0" step="0.1" value="${tv}" placeholder="今日數值" style="border-color:${c.main}"/>
        <span style="font-size:13px;color:var(--muted)">${h.unit||''}</span>
        <button class="record-btn" style="background:${c.main}" onclick="recordNum('${h.id}')">記錄</button>
      </div>`;
  }
  return `<div class="habit-page">
    <div class="habit-header">
      <div>
        <div class="tag" style="background:${c.light};color:${c.main}">${tpl?.icon} ${tpl?.name}</div>
        <div class="habit-name">${h.name}</div>
      </div>
      <button class="icon-btn" onclick="confirmDelete('${h.id}')">🗑</button>
    </div>
    <div class="streak-row">
      <div class="streak-item"><div class="streak-num" style="color:${c.main}">${calcStreak(h)}</div><div class="streak-label">連續天數</div></div>
      <div class="streak-item"><div class="streak-num">${mDone}</div><div class="streak-label">本月完成</div></div>
      <div class="streak-item"><div class="streak-num">${Math.round(mDone/mTotal*100)}%</div><div class="streak-label">本月達成率</div></div>
    </div>
    ${content}
  </div>`;
}

function buildCalendar(h, y, m, c) {
  const today = todayKey(), first = new Date(y,m,1).getDay(), days = daysInMonth(y,m);
  let cells = '';
  for (let i = 0; i < first; i++) cells += `<div class="cal-day"></div>`;
  for (let d = 1; d <= days; d++) {
    const key = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const done = h.records[key] != null, isToday = key === today, future = key > today;
    cells += `<div class="cal-day ${done?'done':''} ${isToday?'today':''} ${future?'future':''}"
      style="${done?`background:${c.main};`:''}"
      ${future?'':` onclick="toggleCheckin('${h.id}','${key}')"`}>${d}</div>`;
  }
  return `<div class="cal-nav">
    <button class="cal-nav-btn" onclick="changeMonth('${h.id}',-1)">‹</button>
    <span class="cal-nav-title">${monthName(y,m)}</span>
    <button class="cal-nav-btn" onclick="changeMonth('${h.id}',1)">›</button>
  </div>
  <div class="cal-grid">
    <div class="cal-dh">日</div><div class="cal-dh">一</div><div class="cal-dh">二</div>
    <div class="cal-dh">三</div><div class="cal-dh">四</div><div class="cal-dh">五</div><div class="cal-dh">六</div>
    ${cells}
  </div>`;
}

function buildGradientCalendar(h, y, m, c) {
  const today = todayKey(), first = new Date(y,m,1).getDay(), days = daysInMonth(y,m);
  const target = h.target || 1;
  const hex = c.main.replace('#','');
  const r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
  let cells = '';
  for (let i = 0; i < first; i++) cells += `<div class="cal-day"></div>`;
  for (let d = 1; d <= days; d++) {
    const key = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const val = h.records[key], isToday = key === today, future = key > today;
    let bg = '', txtCol = 'var(--muted)';
    if (val != null && !future) {
      const ratio = Math.min(val/target, 1);
      bg = `rgba(${r},${g},${b},${0.10+ratio*0.90})`;
      txtCol = ratio > 0.5 ? '#fff' : c.main;
    }
    cells += `<div class="cal-day ${isToday?'today':''} ${future?'future':''}"
      style="${bg?`background:${bg};`:''}color:${txtCol};" title="${val!=null?val+' '+h.unit:''}"
      ${future?'':` onclick="openGradientInput('${h.id}','${key}',${d})"`}>${d}</div>`;
  }
  return `<div class="cal-nav">
    <button class="cal-nav-btn" onclick="changeMonth('${h.id}',-1)">‹</button>
    <span class="cal-nav-title">${monthName(y,m)}</span>
    <button class="cal-nav-btn" onclick="changeMonth('${h.id}',1)">›</button>
  </div>
  <div style="font-size:11px;color:var(--muted);margin-bottom:6px">目標：每天 ${target} ${h.unit||''} · 點日期輸入數值</div>
  <div class="cal-grid">
    <div class="cal-dh">日</div><div class="cal-dh">一</div><div class="cal-dh">二</div>
    <div class="cal-dh">三</div><div class="cal-dh">四</div><div class="cal-dh">五</div><div class="cal-dh">六</div>
    ${cells}
  </div>
  <div class="grad-legend" style="margin-top:10px">
    <span class="grad-label">0%</span>
    <div style="flex:1;height:8px;border-radius:4px;background:linear-gradient(to right,rgba(${r},${g},${b},.10),rgba(${r},${g},${b},1))"></div>
    <span class="grad-label">100%</span>
  </div>`;
}

function openGradientInput(id, key) {
  const h = habits.find(h => h.id === id);
  const c = colorForIndex(habits.indexOf(h));
  const existing = h.records[key] ?? '';
  document.getElementById('grad-input-overlay')?.remove();
  const ov = document.createElement('div'); ov.className = 'modal-overlay'; ov.id = 'grad-input-overlay';
  ov.innerHTML = `<div class="modal" style="max-width:300px">
    <div class="modal-title" style="font-size:16px">${key.slice(5).replace('-','/')} 的紀錄</div>
    <div class="modal-sub">目標：${h.target} ${h.unit||''}</div>
    <div class="field-label">今日完成量</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
      <input class="field-input" id="grad-val" type="number" min="0" step="0.1" value="${existing}" placeholder="0" style="margin:0;border-color:${c.main}"/>
      <span style="font-size:14px;color:var(--muted);white-space:nowrap">${h.unit||''}</span>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="document.getElementById('grad-input-overlay').remove()">取消</button>
      ${existing!==''?`<button class="btn" onclick="clearGradVal('${id}','${key}')" style="flex:.6;color:#E24B4A;border-color:#E24B4A">清除</button>`:''}
      <button class="btn btn-primary" style="background:${c.main};border-color:${c.main}" onclick="saveGradVal('${id}','${key}')">儲存</button>
    </div>
  </div>`;
  document.getElementById('app').appendChild(ov);
  setTimeout(() => document.getElementById('grad-val')?.focus(), 50);
}

async function saveGradVal(id, key) {
  const h = habits.find(h => h.id === id);
  const val = parseFloat(document.getElementById('grad-val')?.value);
  if (isNaN(val) || val < 0) { showToast('請輸入有效數值'); return; }
  h.records[key] = val;
  await saveOne(h);
  document.getElementById('grad-input-overlay')?.remove();
  render(); showToast(`✅ 已記錄 ${val} ${h.unit||''}`);
}

async function clearGradVal(id, key) {
  const h = habits.find(h => h.id === id);
  delete h.records[key];
  await saveOne(h);
  document.getElementById('grad-input-overlay')?.remove(); render();
}

function initChart(h, idx) {
  const canvas = document.getElementById(`chart-${h.id}`); if (!canvas) return;
  const ex = Chart.getChart(canvas); if (ex) ex.destroy();
  const c = colorForIndex(idx);
  const today = new Date(); const labels = [], data = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(today); d.setDate(today.getDate()-i);
    const key = d.toISOString().slice(0,10);
    labels.push(`${d.getMonth()+1}/${d.getDate()}`);
    data.push(h.records[key] != null ? Number(h.records[key]) : null);
  }
  const isBar = h.template === 'bar';
  const barColors = data.map(v => {
    if (v == null) return 'transparent';
    const ratio = h.target ? v/h.target : 1;
    return ratio <= 0.2 ? '#E74C3C' : ratio <= 0.5 ? '#F39C12' : '#1D9E75';
  });
  charts[h.id] = new Chart(canvas, {
    type: isBar ? 'bar' : 'line',
    data: { labels, datasets: [{
      data,
      ...(isBar
        ? { backgroundColor: barColors, borderRadius: 4, borderSkipped: false }
        : { borderColor: c.main, backgroundColor: c.main+'22', fill: true, tension: .35, pointRadius: 3, spanGaps: true })
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 9 }, maxTicksLimit: 7 } },
        y: { grid: { color: 'rgba(0,0,0,.05)' }, ticks: { font: { size: 9 } }, beginAtZero: true }
      }
    }
  });
}

function renderDots() {
  const dots = document.getElementById('page-dots');
  if (!habits.length) { dots.innerHTML = ''; return; }
  dots.innerHTML = habits.map((_,i) =>
    `<div class="page-dot ${i===curPage?'active':''}" onclick="goPage(${i})"></div>`).join('');
}

// ── Today ─────────────────────────────────────────────────────────────────────
function renderTodayView() { updateTodayProgress(); renderTodayList(); }

function updateTodayProgress() {
  const today = todayKey(), total = habits.length;
  const done  = habits.filter(h => h.records[today] != null).length;
  const pct   = total ? Math.round(done/total*100) : 0;
  const col   = pct <= 20 ? '#E74C3C' : pct <= 50 ? '#F39C12' : '#1D9E75';
  const dimCol= pct <= 20 ? 'rgba(231,76,60,.15)' : pct <= 50 ? 'rgba(243,156,18,.15)' : 'rgba(29,158,117,.15)';
  const CELLS = 15, filled = Math.round(pct/100*CELLS);
  const cells = Array.from({length:CELLS}, (_,i) =>
    `<div class="kanban-block" style="flex:1;height:28px;background:${i<filled?col:dimCol};border-radius:4px;"></div>`
  ).join('');
  document.getElementById('today-summary').innerHTML = `
    <div class="kanban-header">
      <span class="kanban-title">今日進度</span>
      <span class="kanban-meta" style="color:${col};font-weight:700">${done}/${total} &nbsp;${pct}%</span>
    </div>
    <div style="display:flex;gap:5px;align-items:center;">${cells}</div>`;
}

function renderTodayList() {
  const list = document.getElementById('today-list'), today = todayKey();
  if (!habits.length) {
    list.innerHTML = `<div class="all-done-banner"><div style="font-size:48px;opacity:.3">📋</div><div style="font-weight:600;font-size:16px">還沒有習慣</div><div style="font-size:13px">點右上角 + 新增</div></div>`;
    return;
  }
  const undone = habits.filter(h => h.records[today] == null);
  const done   = habits.filter(h => h.records[today] != null);
  let html = '';
  if (!undone.length) {
    html += `<div class="all-done-banner"><div style="font-size:52px">🎉</div><div style="font-weight:700;font-size:18px;color:var(--text)">今日全部完成！</div><div style="font-size:13px">明天繼續加油</div></div>`;
  } else {
    html += `<div class="today-section-title">未完成 (${undone.length})</div>` + undone.map(h=>buildTodayItem(h,false)).join('');
  }
  if (done.length) html += `<div class="today-section-title">已完成 (${done.length})</div>` + done.map(h=>buildTodayItem(h,true)).join('');
  list.innerHTML = html;
}

function buildTodayItem(h, isDone) {
  const idx = habits.indexOf(h), c = colorForIndex(idx);
  const tpl = TEMPLATES.find(t => t.id === h.template);
  const streak = calcStreak(h), today = todayKey(), val = h.records[today];
  const needsNum = !isDone && (h.template==='number'||h.template==='gradient'||h.template==='bar');
  const numInline = needsNum ? `<div class="today-num-inline" onclick="event.stopPropagation()">
    <input id="tli-${h.id}" type="number" min="0" step="0.1" placeholder="${h.target||'0'}" style="border-color:${c.main}"/>
    <span>${h.unit||''}</span>
    <button style="background:${c.main}" onclick="recordTodayNum('${h.id}')">記錄</button>
  </div>` : '';
  const subText = isDone && val != null && h.template !== 'checkin'
    ? `已記錄 ${val} ${h.unit||''}` : `連續 ${streak} 天 · ${tpl?.name}`;
  return `<div class="today-item ${isDone?'done-item':''}" onclick="toggleTodayItem('${h.id}')">
    <div class="today-check" style="${isDone?`background:${c.main};border-color:${c.main};`:`border-color:${c.main};`}">
      ${isDone?`<span style="color:#fff">✓</span>`:''}
    </div>
    <span class="today-item-icon">${tpl?.icon}</span>
    <div class="today-item-body">
      <div class="today-item-name">${h.name}</div>
      <div class="today-item-sub">${subText}</div>
      ${numInline}
    </div>
  </div>`;
}

async function toggleTodayItem(id) {
  const h = habits.find(h => h.id === id), today = todayKey();
  if (h.records[today] != null) { delete h.records[today]; showToast('已取消完成'); }
  else {
    if (h.template !== 'checkin') { showToast('請輸入數值後記錄'); return; }
    h.records[today] = 1; showToast('✅ 完成！');
  }
  await saveOne(h); renderTodayView(); render();
}

async function recordTodayNum(id) {
  const h = habits.find(h => h.id === id);
  const val = parseFloat(document.getElementById(`tli-${id}`)?.value);
  if (isNaN(val) || val < 0) { showToast('請輸入有效數值'); return; }
  h.records[todayKey()] = val;
  await saveOne(h); showToast(`✅ 已記錄 ${val} ${h.unit||''}`); renderTodayView(); render();
}

// ── Habit actions ──────────────────────────────────────────────────────────────
function goPage(n) {
  curPage = Math.max(0, Math.min(habits.length-1, n));
  document.getElementById('habit-pages').style.transform = `translateX(-${curPage*100}%)`;
  renderDots();
}

async function toggleCheckin(id, key) {
  const h = habits.find(h => h.id === id);
  if (h.records[key] != null) { delete h.records[key]; showToast('已取消打卡'); }
  else { h.records[key] = 1; showToast('✅ 打卡成功！'); }
  await saveOne(h); render();
}

async function recordNum(id) {
  const h = habits.find(h => h.id === id);
  const val = parseFloat(document.getElementById(`input-${id}`)?.value);
  if (isNaN(val) || val < 0) { showToast('請輸入有效數值'); return; }
  h.records[todayKey()] = val; await saveOne(h); render(); showToast(`✅ 已記錄 ${val} ${h.unit||''}`);
}

function changeMonth(id, dir) {
  const vm = viewMonth[id]; let {y,m} = vm;
  m += dir; if (m>11){m=0;y++;} if (m<0){m=11;y--;}
  viewMonth[id] = {y,m}; render();
}

function updateStreak() {
  document.getElementById('streak-fire').textContent = calcMaxStreak() >= 7 ? '🔥' : '';
}

// ── Add modal ─────────────────────────────────────────────────────────────────
function openAddModal() {
  let selTpl = 'checkin';
  document.querySelector('.modal-overlay')?.remove();
  const ov = document.createElement('div'); ov.className = 'modal-overlay';
  ov.innerHTML = `<div class="modal">
    <div class="modal-title">新增習慣</div>
    <div class="modal-sub">選擇追蹤模板</div>
    <div class="tpl-grid">
      ${TEMPLATES.map(t=>`<div class="tpl-card ${t.id==='checkin'?'selected':''}" id="atpl-${t.id}" onclick="selTplFn('${t.id}')">
        <div class="tpl-icon-box" style="background:${PALETTE[0].light}">${t.icon}</div>
        <div class="tpl-name">${t.name}</div><div class="tpl-desc">${t.desc}</div>
      </div>`).join('')}
    </div>
    <div class="field-label">習慣名稱</div>
    <input class="field-input" id="new-name" placeholder="例如：每天閱讀 30 分鐘"/>
    <div id="unit-wrap" style="display:none">
      <div class="field-label">單位</div>
      <input class="field-input" id="new-unit" placeholder="例如：km、ml、分鐘"/>
    </div>
    <div id="target-wrap" style="display:none">
      <div class="field-label">每日目標量</div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <input class="field-input" id="new-target" type="number" min="0" step="0.1" placeholder="例如：5" style="margin:0"/>
        <span id="target-unit-label" style="font-size:13px;color:var(--muted);white-space:nowrap"></span>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="addHabit()">建立習慣</button>
    </div>
  </div>`;
  document.getElementById('app').appendChild(ov);
  addModal = { ov, getTpl: () => selTpl };
  window.selTplFn = id => {
    selTpl = id;
    TEMPLATES.forEach(t => document.getElementById(`atpl-${t.id}`)?.classList.toggle('selected', t.id===id));
    const needUnit = id !== 'checkin';
    document.getElementById('unit-wrap').style.display = needUnit ? 'block' : 'none';
    document.getElementById('target-wrap').style.display = (id==='gradient'||id==='bar') ? 'block' : 'none';
  };
  document.getElementById('new-unit').addEventListener('input', e => {
    document.getElementById('target-unit-label').textContent = e.target.value || '';
  });
}

function closeModal() {
  addModal?.ov.remove(); addModal = null;
  document.querySelector('.confirm-modal')?.remove();
  document.getElementById('grad-input-overlay')?.remove();
}

async function addHabit() {
  const name = document.getElementById('new-name')?.value.trim();
  if (!name) { showToast('請輸入習慣名稱'); return; }
  const tplId  = addModal?.getTpl() || 'checkin';
  const unit   = document.getElementById('new-unit')?.value.trim() || '';
  const target = (tplId==='gradient'||tplId==='bar')
    ? parseFloat(document.getElementById('new-target')?.value) || 1 : null;
  const id = 'h' + Date.now();
  const h = { id, name, template: tplId, unit, target, records: {}, order: habits.length };
  habits.push(h);
  viewMonth[id] = { y: new Date().getFullYear(), m: new Date().getMonth() };
  curPage = habits.length - 1;
  await saveOne(h); closeModal(); render(); showToast('✨ 習慣已建立！');
}

function confirmDelete(id) {
  const h = habits.find(h => h.id === id);
  document.querySelector('.confirm-modal')?.remove();
  const el = document.createElement('div'); el.className = 'confirm-modal';
  el.innerHTML = `<div class="confirm-box">
    <div class="confirm-title">刪除習慣</div>
    <div class="confirm-sub">確定刪除「${h.name}」？<br>所有紀錄將消失。</div>
    <div class="confirm-actions">
      <button class="btn" onclick="this.closest('.confirm-modal').remove()">取消</button>
      <button class="btn btn-danger" onclick="deleteHabit('${id}')">刪除</button>
    </div>
  </div>`;
  document.getElementById('app').appendChild(el);
}

async function deleteHabit(id) {
  habits = habits.filter(h => h.id !== id);
  curPage = Math.min(curPage, Math.max(0, habits.length-1));
  await removeOne(id);
  document.querySelector('.confirm-modal')?.remove(); render(); showToast('習慣已刪除');
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function renderDashboard() {
  const today = todayKey(), total = habits.length;
  const todayDone = habits.filter(h => h.records[today] != null).length;
  const past30 = Array.from({length:30}, (_,i) => { const d=new Date(); d.setDate(d.getDate()-i); return d.toISOString().slice(0,10); });
  const overall = total ? Math.round(habits.reduce((s,h) => s + past30.filter(k=>h.records[k]!=null).length/30, 0)/total*100) : 0;
  const rows = habits.map((h,idx) => {
    const c = colorForIndex(idx), tpl = TEMPLATES.find(t=>t.id===h.template);
    const done = past30.filter(k=>h.records[k]!=null).length;
    const pct = Math.round(done/30*100);
    const col = pct<=20?'#E74C3C':pct<=50?'#F39C12':'#1D9E75';
    return `<div class="dash-habit">
      <div class="dash-habit-top">
        <div style="display:flex;align-items:center;gap:8px"><span style="font-size:18px">${tpl?.icon}</span><div class="dash-habit-name">${h.name}</div></div>
        <div class="dash-pct" style="color:${col}">${pct}%</div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${col}"></div></div>
      <div class="dash-sub">過去30天 ${done}/30 天 · 連續 ${calcStreak(h)} 天</div>
    </div>`;
  }).join('');
  document.getElementById('dashboard-content').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">進行中習慣</div></div>
      <div class="stat-card"><div class="stat-num" style="color:${overall<=20?'#E74C3C':overall<=50?'#F39C12':'#1D9E75'}">${overall}%</div><div class="stat-label">過去30天達成率</div></div>
      <div class="stat-card"><div class="stat-num">${todayDone}/${total}</div><div class="stat-label">今日完成</div></div>
      <div class="stat-card"><div class="stat-num">${calcMaxStreak()}</div><div class="stat-label">最長連續（天）</div></div>
    </div>
    <div class="section-title">各習慣達成率（過去30天）</div>
    ${rows||'<div style="color:var(--muted);font-size:13px;text-align:center;padding:24px 0">還沒有習慣</div>'}`;
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function calcStreak(h) {
  let s = 0; const today = todayKey(); let d = new Date();
  if (h.records[today] == null) d.setDate(d.getDate()-1);
  while (true) { const k=d.toISOString().slice(0,10); if(h.records[k]!=null){s++;d.setDate(d.getDate()-1);}else break; }
  return s;
}
function calcMaxStreak() { return habits.length ? Math.max(...habits.map(calcStreak)) : 0; }

function switchView(v, el) {
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(x=>x.classList.remove('active'));
  document.getElementById(`view-${v}`).classList.add('active');
  el.classList.add('active');
  if (v==='today')     renderTodayView();
  if (v==='dashboard') renderDashboard();
}
</script>
</body>
</html>
